<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="320" height="480"></canvas>
        
        
        <button id="dev-btn" class="hidden">Dev Mode</button>
        <button id="close-dev-btn" class="hidden">Exit Dev</button>

        
        <div id="ui-layer">
            <h1 id="menu-title">Flappy Bird</h1>
            
           
            <p id="congrats-msg" class="hidden">🎉 New High Score! 🎉</p>
            
            <p id="score-display" class="hidden"></p>
            <p id="high-score-display"></p>
            
            <div id="button-container">
                <button id="start-btn">Play</button>
                <button id="menu-btn" class="hidden">Main Menu</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
